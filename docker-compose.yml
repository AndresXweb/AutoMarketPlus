# Bases de datos de PRUEBA para tests de integración (semana 6).
# Puerto 5433 para no chocar con Postgres de desarrollo (5432).
# Nombre de BD termina en _test, como exige el bootcamp.
#
#   docker compose up -d --wait
#   export DATABASE_URL="postgresql://automarket:automarket@localhost:5433/automarket_test"
#   npm run db:migrate
#   npm test
#   docker compose down -v

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: automarket
      POSTGRES_PASSWORD: automarket
      POSTGRES_DB: automarket_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automarket -d automarket_test"]
      interval: 2s
      timeout: 5s
      retries: 15